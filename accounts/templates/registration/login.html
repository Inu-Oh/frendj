{% extends "base_bootstrap.html" %}


{% block content %}
<div id="login" class="p-5">
    <h1 class="display-3 text-muted pt-3">Log in</h1>

    <div class="container p-3">
        <form method="post" action="{% url 'login' %}">
            {% if form.errors %}
                <p>Your username and password didn't match. Please try again.</p>
            {% endif %}
            {% csrf_token %}
            <div class="form-floating">
                <input class="form-control" type="text" name="username" autofocus autocapitalize="none" 
                    autocomplete="username" maxlength="150" required id="id_username" />
                <label for="id_username" class="form-label" placeholder="Username">
                    Username</label>
                <div>{{ form.username.errors }}</div>
            </div>
            <br/>
            <div class="form-floating">
                <input class="form-control" type="password" name="password"
                    autocomplete="current-password" required id="id_password" />
                <label for="id_password" class="form-label">
                    Password</label>
                <div>{{ form.password.errors }}</div>
            </div>
            <div class="container-fluid pt-4 d-flex justify-content-between">
                <input type="submit" class="btn btn-success" value="Login &raquo;" />
                <input type="hidden" class="next" value="{{ next }}" />
                <a class="btn btn-primary" href="{% url 'accounts:register' %}">
                    Create a new account &raquo;</a>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
