{% extends "base_bootstrap.html" %}


{% block content %}
<div id="register" class="p-5">
    <h1 class="display-3 text-muted pt-3">Register a new account</h1>

    {% if form.errors %}
        <p>Your username and password didn't match. Please try again.</p>
    {% endif %}

    {% load crispy_forms_tags %}
    <div class="p-3 text-dark">
        <form action="{% url 'accounts:register' %}" method='post'>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="container-fluid pt-4 d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">Sign Up</button>
                <a class="btn btn-success" href="{% url 'accounts:login' %}">
                    Back to Login &raquo;</a>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
