{% extends "base_bootstrap.html" %}


{% block content %}
<div id="register" class="app-panel app-panel-content">
    <h1 class="display-5 text-muted pt-3">Register a new account</h1>

    {% if form.errors %}
        <p>Your username and password didn't match. Please try again.</p>
    {% endif %}

    {% load crispy_forms_tags %}
    <div class="p-3 text-dark">
        <form action="{% url 'accounts:register' %}" method='post'>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="container-fluid pt-4 d-flex justify-content-between">
                <button type="submit" class="btn auth-button auth-primary">
                    Sign Up &raquo;
                </button>
                <a class="btn auth-button auth-secondary" href="{% url 'accounts:login' %}">
                    Back to Login &raquo;
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
