{% extends "base_menu.html" %}


{% block content %}

    <div class="app-page">
        <header>
            <h1 class="display-3">Set up your profile</h1>
        </header>
    </div>

    <div class="app-page app-panel app-panel-content">
        {% load crispy_forms_tags %}
        <form action="" method="post" id="upload_form" class="profile-creation-form"
            enctype="multipart/form-data">
            {% if form.errors %}
                <p>There was an error with your form. Please try again.</p>
            {% endif %}
            {% csrf_token %}
            {{ form|crispy }}
            <input type="submit" value="Submit &raquo;" class="btn btn-lg app-primary">
        </form>
    </div>

{% endblock content %}
