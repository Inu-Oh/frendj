{% extends "base_menu.html" %}


{% block content %}
<div class="container-fluid" id="narrow-staff-form">
    <div class="p-3">
    <header class="container-fluid p-3">
        <h1 class="fs-2 text-muted">
            Edit module <span class="text-dark">{{ module.name|title }}</span>
        </h1>
        <p class="fs-5 ps-3">Use this form to edit modules names</p>
    </header>

    <main class="container-fluid border border-3 rounded-4 pb-3">
        <div class="p-3">
            <h4 class="py-3">Update module name</h4>
            {% load crispy_forms_tags %}
            <form action="" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="container-fluid d-flex justify-content-between">
                    <input type="submit" value="Submit"
                        class="btn btn-outline-success me-3 text-dark">
                    <input type="submit" value="Cancel &nbsp;&raquo;&nbsp; return to menu"
                        class="btn btn-outline-danger text-dark"
                        onclick="window.location.href='{% url 'staff:manage_content' %}';return false;">
                </div>
            </form>
        </div>
    </main>
    </div>
</div>
{% endblock content %}
