{% extends "base_menu.html" %}


{% block content %}
<div class="app-page" id="narrow-staff-form">
    <header class="app-heading">
        <h1>
            Edit phrase <span class="text-dark">"{{ phrase }}"</span> 
            
        </h1>
        <h5 class="text-muted">
            <small>Module name: {{ module.name|title }}</small>
        </h5>
        <p class="fs-5 ps-3">
            Use this form to edit vocabulary, phrases and expressions
        </p>
    </header>

    <main class="app-panel app-panel-content">
        <div class="p-3">
            <h4 class="py-3">Update fields</h4>
            {% load crispy_forms_tags %}
            <form action="" method="post" enctype="multipart/form-data" class="p-2">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="container-fluid d-flex justify-content-between">
                    <input type="submit" value="Submit"
                        class="btn auth-button auth-primary me-3">
                    <input type="submit" value="Cancel &nbsp;&raquo;&nbsp; return to menu"
                        class="btn auth-button auth-danger"
                        onclick="window.location.href='{% url 'staff:manage_content' %}';return false;">
                </div>
            </form>
       </div>
    </main>
</div>
{% endblock content %}
